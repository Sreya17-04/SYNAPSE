<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNAPSE - Sign In</title>
    <meta name="theme-color" content="#0a0d17">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="auth.css">
    </head>
<body>
    <svg xmlns="http://www.w3.org/2000/svg" class="icon-sprite" hidden aria-hidden="true" focusable="false">
        <symbol id="i-arrow" viewBox="0 0 24 24">
            <path d="M5 12h13"></path>
            <path d="m13 7 5 5-5 5"></path>
        </symbol>
        <symbol id="i-shield" viewBox="0 0 24 24">
            <path d="M12 3.2 5 6v5.6c0 4.2 2.9 7.6 7 9.2 4.1-1.6 7-5 7-9.2V6l-7-2.8Z"></path>
            <path d="m9.2 12.2 2 2 3.6-3.8"></path>
        </symbol>
    </svg>

    <div class="auth-page">
        <div class="auth-bg" aria-hidden="true">
            <span class="orb orb-a"></span>
            <span class="orb orb-b"></span>
            <span class="orb orb-c"></span>

            <span class="tile tile-a" data-parallax="0.035"></span>
            <span class="tile tile-b" data-parallax="0.06"></span>
            <span class="tile tile-c" data-parallax="0.045"></span>
        </div>

        <span class="cursor-glow" aria-hidden="true"></span>

        <main class="form-box">
            <div class="auth-brand">
                <div class="brand-logo">S</div>
                <div>
                    <div class="brand-name">SYNAPSE</div>
                    <div class="brand-sub">Department Community</div>
                </div>
            </div>

            <span class="form-eyebrow">
                <svg class="icon" aria-hidden="true"><use href="#i-shield"></use></svg>
                Secure access
            </span>
            <h2>Sign in</h2>

            <div class="alert-msg alert-error" id="alert-error" role="alert" aria-live="assertive"></div>
            <div class="alert-msg alert-success" id="alert-success" role="alert" aria-live="assertive"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required
                        autocomplete="username" autocapitalize="off" spellcheck="false">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required
                        autocomplete="current-password">
                </div>
                <button type="submit" class="btn-submit" id="submit-btn">
                    Sign In
                    <svg class="icon" aria-hidden="true"><use href="#i-arrow"></use></svg>
                </button>
            </form>
        </main>
    </div>

    <script src="config.js"></script>
    <script src="auth-common.js"></script>
    <script src="login.js"></script>
    <script src="auth-fx.js"></script>


    </body>
</html>
