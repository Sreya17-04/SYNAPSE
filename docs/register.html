<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNAPSE – Create Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="auth.css">
    </head>
<body>
    <div class="auth-page">
        <!-- Left Branding -->
        <div class="brand-panel">
            <div class="brand-content">
                <div class="brand-logo">S</div>
                <div class="brand-name">SYNAPSE</div>
                <div class="brand-tagline">Join your Department Community</div>
                <div class="brand-steps">
                    <div class="brand-step">
                        <div class="step-num">1</div>
                        <span>Create your free student account</span>
                    </div>
                    <div class="brand-step">
                        <div class="step-num">2</div>
                        <span>Connect with department peers</span>
                    </div>
                    <div class="brand-step">
                        <div class="step-num">3</div>
                        <span>Share knowledge & grow together</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Register Form -->
        <div class="form-panel">
            <div class="form-box">
                <h2>Create Account</h2>
                <p>Join thousands of students on SYNAPSE. It's free!</p>

                <div class="alert-msg alert-error" id="alert-error" role="alert" aria-live="assertive"></div>
                <div class="alert-msg alert-success" id="alert-success" role="alert" aria-live="assertive"></div>

                <form id="register-form">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="Your full name" required autocomplete="name">
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="you@college.edu" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="At least 8 characters" required autocomplete="new-password" minlength="8">
                        <div class="password-hint">Minimum 6 characters</div>
                    </div>
                    <button type="submit" class="btn-submit" id="submit-btn">Create Account</button>
                </form>

                <div class="form-footer">
                    Already have an account? <a href="login.html">Sign in</a>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="auth-common.js"></script>
    <script src="register.js"></script>


    </body>
</html>
